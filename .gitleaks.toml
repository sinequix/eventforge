# Extend the default gitleaks ruleset, but exclude the generated, minified
# plugin bundles (esbuild output committed for the plugin-bundle verification
# gate). Minifier tokens false-positive on the generic-api-key rule; these are
# build artifacts, not source. Source files are still scanned normally.
[extend]
useDefault = true

[allowlist]
description = "Generated minified plugin bundles (esbuild output, not source)"
paths = [
  'plugins/eventforge/server/eventforge-standalone\.cjs',
  'plugins/eventforge/server/eventforge-mcp-http\.cjs',
  'plugins/eventforge/server/eventforge-mcp\.mjs',
]

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Public PostHog project identifier in the runtime analytics manifest"
condition = "AND"
regexTarget = "line"
regexes = ['''(?i)"posthogKey"\s*:\s*"phc_[a-z0-9]+"''']
paths = [
  '''apps/console/public/analytics-config\.json''',
  '''apps/console/dist/analytics-config\.json''',
]

[[rules.allowlists]]
description = "Public Cloudflare deployment version recorded in the release audit"
condition = "AND"
regexTarget = "line"
regexes = ['''(?m)^- API version: `d56ad744-eeb3-42be-8b24-7e4a3ed0ceac`\.$''']
paths = ['''(^|/)workfiles/CONFIGURATION\.md$''']
